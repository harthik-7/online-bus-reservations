<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="busGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1769AA" />
      <stop offset="100%" stop-color="#0A1C2E" />
    </linearGradient>
    <filter id="glowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF8A00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Bus Icon Emblem -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="85" height="85" rx="20" fill="url(#busGradW)" filter="url(#glowW)"/>
    <rect x="2" y="2" width="81" height="81" rx="18" fill="none" stroke="#FF8A00" stroke-width="2" stroke-opacity="0.8"/>

    <g transform="translate(16, 22)">
      <path d="M4 12 C4 4, 8 2, 26 2 L42 2 C48 2, 52 6, 52 14 L52 32 C52 34, 50 36, 48 36 L4 36 Z" fill="#FFFFFF"/>
      <path d="M28 6 L44 6 C47 6, 48 8, 48 12 L48 16 L28 16 Z" fill="#1769AA"/>
      <rect x="8" y="6" width="8" height="10" rx="2" fill="#1769AA"/>
      <rect x="18" y="6" width="8" height="10" rx="2" fill="#1769AA"/>
      <path d="M4 22 L52 22 L50 25 L4 25 Z" fill="url(#logoGradW)"/>
      <circle cx="48" cy="30" r="2.5" fill="#FF8A00"/>
      <circle cx="14" cy="36" r="6" fill="#0A1C2E"/>
      <circle cx="14" cy="36" r="2.5" fill="#FFFFFF"/>
      <circle cx="40" cy="36" r="6" fill="#0A1C2E"/>
      <circle cx="40" cy="36" r="2.5" fill="#FFFFFF"/>
      <line x1="-6" y1="12" x2="0" y2="12" stroke="#FF8A00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-10" y1="18" x2="-2" y2="18" stroke="#FF8A00" stroke-width="2" stroke-linecap="round"/>
      <line x1="-6" y1="24" x2="0" y2="24" stroke="#FF8A00" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography for Dark backgrounds -->
  <text x="115" y="58" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
    HARTHIK<tspan fill="#FF8A00">RAJ</tspan>
  </text>
  
  <g transform="translate(115, 68)">
    <rect x="0" y="0" width="280" height="20" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="8" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FF8A00">
      ONLINE BUS RESERVATION SYSTEM
    </text>
  </g>
